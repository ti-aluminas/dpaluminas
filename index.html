            <select id="p-escolaridade" ${editavel ? '' : 'disabled'}>
              <option value="">Selecione</option>
              <option>Analfabeto</option>
              <option>Fundamental incompleto</option>
              <option>Fundamental completo</option>
              <option>Médio incompleto</option>
              <option>Médio completo</option>
              <option>Superior incompleto</option>
              <option>Superior completo</option>
              <option>Pós-graduação</option>
              <option>Mestrado</option>
              <option>Doutorado</option>
            </select>
          </div>
          <div class="field">
            <label for="p-corRaca">Cor/raça</label>
            <select id="p-corRaca" ${editavel ? '' : 'disabled'}>
              <option value="">Selecione</option>
              <option>Branca</option>
              <option>Preta</option>
              <option>Parda</option>
              <option>Amarela</option>
              <option>Indígena</option>
              <option>Prefiro não informar</option>
            </select>
          </div>
          <div class="field">
            <label for="p-dependentes">Há dependentes? <span class="req">*</span></label>
            <select id="p-dependentes" ${editavel ? '' : 'disabled'}>
              <option value="">Selecione</option><option>Não</option><option>Sim</option>
            </select>
          </div>
          <div class="field">
            <label for="p-numDependentes">Quantos dependentes</label>
            <input id="p-numDependentes" type="number" min="0" placeholder="0" ${editavel ? '' : 'disabled'} />
          </div>
          <div class="field">
            <label for="p-menoridade">Menor de idade? <span class="req">*</span></label>
            <select id="p-menoridade" ${editavel ? '' : 'disabled'}>
              <option value="">Selecione</option><option>Não</option><option>Sim</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-num"><div class="n">2</div><h2>Dados bancários</h2></div>
        <div class="vh-sub" style="margin-bottom:12px;">Para o pagamento do seu salário.</div>
        <div class="grid cols3">
          <div class="field"><label for="p-pis">PIS/PASEP <span class="req">*</span></label>
            <input id="p-pis" type="text" placeholder="000.00000.00-0" ${editavel ? '' : 'disabled'} /></div>
          <div class="field"><label for="p-banco">Banco <span class="req">*</span></label>
            <input id="p-banco" type="text" placeholder="Ex: Banco do Brasil" ${editavel ? '' : 'disabled'} /></div>
          <div class="field"><label for="p-tipoConta">Tipo de conta</label>
            <select id="p-tipoConta" ${editavel ? '' : 'disabled'}><option value="">Selecione</option><option>Corrente</option><option>Poupança</option></select></div>
          <div class="field"><label for="p-agencia">Agência <span class="req">*</span></label>
            <input id="p-agencia" type="text" placeholder="0000" ${editavel ? '' : 'disabled'} /></div>
          <div class="field span2"><label for="p-conta">Conta <span class="req">*</span></label>
            <input id="p-conta" type="text" placeholder="00000-0" ${editavel ? '' : 'disabled'} /></div>
          <div class="field"><label for="p-temPix">Possui PIX?</label>
            <select id="p-temPix" ${editavel ? '' : 'disabled'}><option value="">Selecione</option><option>Sim</option><option>Não</option></select></div>
          <div class="field"><label for="p-tipoPix">Tipo de chave PIX</label>
            <select id="p-tipoPix" ${editavel ? '' : 'disabled'}><option value="">Selecione</option><option>CPF</option><option>E-mail</option><option>Telefone</option><option>Aleatória</option></select></div>
          <div class="field span2"><label for="p-chavePix">Chave PIX</label>
            <input id="p-chavePix" type="text" placeholder="Conforme o tipo selecionado" ${editavel ? '' : 'disabled'} /></div>
        </div>
      </div>

      <div class="card">
        <div class="section-num"><div class="n">3</div><h2>Documentação</h2></div>
        <div class="vh-sub" style="margin-bottom:12px;">De 1 a 3 arquivos por item, foto ou PDF. As fotos são reduzidas automaticamente.</div>
        <div id="portalDocList"></div>
      </div>

      ${editavel ? `
        <div class="card">
          <div class="actions">
            <button class="btn btn-primary" id="portalBtnSalvar" onclick="portalSalvar()">${ICO.check}Enviar meus dados</button>
          </div>
        </div>
      ` : ''}
    `;

    document.getElementById('p-nome').value = rh.nome || '';
    document.getElementById('p-cpf').value = rh.cpf || portalCpf;
    document.getElementById('p-rg').value = rh.rg || '';
    document.getElementById('p-nascimento').value = rh.nascimento || '';
    document.getElementById('p-telefone').value = rh.telefone || '';
    document.getElementById('p-email').value = rh.email || '';
    document.getElementById('p-estadoCivil').value = rh.estadoCivil || '';
    document.getElementById('p-escolaridade').value = rh.escolaridade || '';
    document.getElementById('p-corRaca').value = rh.corRaca || '';
    document.getElementById('p-dependentes').value = rh.dependentes || '';
    document.getElementById('p-numDependentes').value = (rh.numDependentes ?? '');
    document.getElementById('p-menoridade').value = rh.menoridade || '';

    const banc = portalData.bancarios || {};
    document.getElementById('p-pis').value = banc.pis || '';
    document.getElementById('p-banco').value = banc.banco || '';
    document.getElementById('p-tipoConta').value = banc.tipoConta || '';
    document.getElementById('p-agencia').value = banc.agencia || '';
    document.getElementById('p-conta').value = banc.conta || '';
    document.getElementById('p-temPix').value = banc.temPix || '';
    document.getElementById('p-tipoPix').value = banc.tipoPix || '';
    document.getElementById('p-chavePix').value = banc.chavePix || '';

    renderPortalDocs();
  }

  function fmtTamanho(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // Miniatura: imagem real quando for foto, senão selo com a extensão.
  function docThumbHTML(d) {
    const tipo = (d.tipo || '').toLowerCase();
    if (tipo.startsWith('image/') && d.base64) {
      return `<img class="doc-thumb" src="${esc(d.base64)}" alt="${esc(d.nome || 'anexo')}" />`;
    }
    const nome = d.nome || '';
    const ext = nome.includes('.') ? nome.split('.').pop().slice(0, 4).toUpperCase() : 'ARQ';
    return `<span class="doc-thumb-file">${esc(ext)}</span>`;
  }

  function renderPortalDocs() {
    const list = document.getElementById('portalDocList');
    if (!list) return;
    list.classList.add('doc-list');
    const editavel = !!portalData.editavel;
    list.innerHTML = DOC_ITENS.map(it => {
      const arquivos = portalDocs[it.key] || [];
      const cheio = arquivos.length >= MAX_POR_ITEM;
      const arquivosHTML = arquivos.length
        ? `<div class="doc-files">` + arquivos.map((d, i) => `
            <div class="doc-file">
              <div class="doc-file-info">
                ${docThumbHTML(d)}
                <div style="min-width:0;">
                  <div class="doc-file-name">${esc(d.nome)}</div>
                  <div class="rec-item-meta">${esc(fmtTamanho(d.tamanho))}${d.tamanhoOriginal ? ' · reduzido de ' + esc(fmtTamanho(d.tamanhoOriginal)) : ''}</div>
                </div>
              </div>
              ${editavel ? `<button class="btn-remove" onclick="portalRemoveDoc('${it.key}',${i})">Remover</button>` : ''}
            </div>`).join('') + `</div>`
        : '';
      return `
        <div class="doc-card">
          <div class="doc-card-head">
            <span class="doc-card-title">${esc(it.label)}</span>
            <span class="doc-count ${arquivos.length ? 'ok' : ''}">${arquivos.length}/${MAX_POR_ITEM}</span>
          </div>
          ${arquivosHTML}
          ${editavel && !cheio ? `
            <div class="uploader">
              <input type="file" multiple
                accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf"
                onchange="portalAddFiles('${it.key}', this)" />
              <div class="uploader-box">${ICO.anexo}Anexar arquivo</div>
            </div>` : ''}
          ${editavel && cheio ? `<div class="rec-item-meta" style="margin-top:8px;">Limite de ${MAX_POR_ITEM} arquivos atingido.</div>` : ''}
        </div>`;
    }).join('');
  }

  window.portalAddFiles = async function(itemKey, input) {
    const atual = portalDocs[itemKey] || [];
    const espaco = MAX_POR_ITEM - atual.length;
    let files = Array.from(input.files || []);
    if (files.length > espaco) {
      toast(`Máximo de ${MAX_POR_ITEM} arquivos por item. Só os primeiros ${espaco} serão anexados.`);
      files = files.slice(0, espaco);
    }
    if (!files.length) { input.value = ''; return; }

    input.value = '';
    toast(files.length > 1 ? 'Preparando os arquivos...' : 'Preparando o arquivo...');

    let economizado = 0;
    for (const file of files) {
      try {
        const doc = await prepararArquivo(file);
        if (doc.tamanhoOriginal) economizado += (doc.tamanhoOriginal - doc.tamanho);
        if (!portalDocs[itemKey]) portalDocs[itemKey] = [];
        portalDocs[itemKey].push(doc);
      } catch (e) {
        toast('Não consegui ler o arquivo ' + file.name);
      }
    }

    renderPortalDocs();

    const total = tamanhoTotalDocs();
    if (total > LIMITE_TOTAL_BYTES) {
      toast('Os anexos passaram de ' + fmtMB(LIMITE_TOTAL_BYTES) + '. Remova algum arquivo.');
    } else if (total > LIMITE_TOTAL_BYTES * 0.8) {
      toast('Atenção: os anexos estão perto do limite.');
    } else if (economizado > 512 * 1024) {
      toast('Foto otimizada, economizando ' + fmtMB(economizado) + '.');
    }
  };

  window.portalRemoveDoc = function(itemKey, i) {
    if (portalDocs[itemKey]) portalDocs[itemKey].splice(i, 1);
    renderPortalDocs();
  };

  // Soma o tamanho REAL dos arquivos. Antes somava o comprimento da string
  // base64 (~37% maior), entao o "limite de 5 MB" na pratica cortava em ~3,6 MB.
  function tamanhoTotalDocs() {
    let total = 0;
    Object.values(portalDocs).forEach(arr => (arr || []).forEach(d => {
      total += Number(d.tamanho) || (d.base64 ? Math.floor(d.base64.length * 0.75) : 0);
    }));
    return total;
  }

  window.portalSalvar = async function() {
    // Nada é obrigatório para salvar, mas avisamos o que ainda falta.
    const faltando = [];
    [['p-nome','Nome completo'],['p-rg','RG'],['p-nascimento','Data de nascimento'],
     ['p-telefone','Telefone'],['p-estadoCivil','Estado civil'],['p-dependentes','Há dependentes?'],
     ['p-menoridade','Menor de idade?'],['p-pis','PIS/PASEP'],['p-banco','Banco'],
     ['p-agencia','Agência'],['p-conta','Conta']
    ].forEach(([id, rotulo]) => { if (!val(id)) faltando.push(rotulo); });
    DOC_ITENS.forEach(it => { if (!(portalDocs[it.key] || []).length) faltando.push('Documento: ' + it.label); });

    if (tamanhoTotalDocs() > LIMITE_TOTAL_BYTES) {
      toast('Os anexos ultrapassam ' + fmtMB(LIMITE_TOTAL_BYTES) + '. Remova alguns arquivos.');
      return;
    }

    let avisoPendencias = '';
    if (faltando.length > 0) {
      const lista = faltando.slice(0, 6).join(', ') + (faltando.length > 6 ? '…' : '');
      const ok = confirm('Ainda faltam dados obrigatórios:\n\n' + faltando.join('\n') +
        '\n\nVocê pode salvar mesmo assim e completar depois. Deseja salvar agora?');
      if (!ok) return;
      // O aviso so sai DEPOIS que a RPC confirmar. Antes ele dizia "Salvo."
      // antes de salvar e ainda aparecia junto com a mensagem de erro.
      avisoPendencias = 'Salvo. Lembre-se de completar: ' + lista;
    }

    const rhData = {
      nome: val('p-nome'), rg: val('p-rg'), nascimento: val('p-nascimento'),
      telefone: val('p-telefone'), email: val('p-email'), estadoCivil: val('p-estadoCivil'),
      escolaridade: val('p-escolaridade'), corRaca: val('p-corRaca'),
      dependentes: val('p-dependentes'), numDependentes: val('p-numDependentes'), menoridade: val('p-menoridade')
    };
    const bancData = {
      pis: val('p-pis'), banco: val('p-banco'), tipoConta: val('p-tipoConta'),
      agencia: val('p-agencia'), conta: val('p-conta'), temPix: val('p-temPix'),
      tipoPix: val('p-tipoPix'), chavePix: val('p-chavePix')
    };
    const btn = document.getElementById('portalBtnSalvar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    const r = await chamarRPC('rpc_portal_salvar', {
      p_token: portalToken, p_cpf: portalCpf, p_rh: rhData, p_bancarios: bancData, p_documentos: portalDocs
    });
    btn.disabled = false; btn.innerHTML = ICO.check + 'Enviar meus dados';
    if (!r.ok) return;
    toast(avisoPendencias || 'Dados enviados com sucesso! Obrigado.');
    // Recarrega mantendo os dados atualizados
    const rr = await chamarRPC('rpc_portal_abrir', { p_token: portalToken, p_cpf: portalCpf });
    if (rr.ok) {
      portalData = rr.data;
      portalDocs = normalizarDocs(portalData.documentos);
      renderPortalForm();
    }
  };

  // ============================================================
  // ANEXOS DO PORTAL (visão do DP/RH) — lista e baixa os arquivos
  // que o funcionário enviou pelo link do portal.
  // ============================================================
  let staffDocs = {};        // { itemKey: [ {nome,tipo,tamanho,base64} ] }
  let staffRecId = null;
  let staffBoxId = 'dpUploadDocs';
  let staffEditavel = false;
  let staffSujo = false;     // ha anexo novo ainda nao gravado

  async function carregarDocsFuncionario(recId, boxId, editavel) {
    staffRecId = recId;
    staffBoxId = boxId || 'dpUploadDocs';
    staffEditavel = !!editavel;
    staffSujo = false;
    const box = document.getElementById(staffBoxId);
    if (!box) return;
    const r = await chamarRPC('rpc_dp_documentos', { p_id: recId });
    staffDocs = normalizarDocs(r.ok ? r.data : null);
    renderStaffDocs();
  }

  function renderStaffDocs() {
    const box = document.getElementById(staffBoxId);
    if (!box) return;
    const total = Object.values(staffDocs).reduce((n, a) => n + (a || []).length, 0);
    box.classList.remove('rec-list');

    const grade = '<div class="doc-list">' + DOC_ITENS.map(it => {
      const arquivos = staffDocs[it.key] || [];
      const cheio = arquivos.length >= MAX_POR_ITEM;
      const linhas = arquivos.length
        ? '<div class="doc-files">' + arquivos.map((d, i) => `
            <div class="doc-file">
              <div class="doc-file-info">
                ${docThumbHTML(d)}
                <div style="min-width:0;">
                  <div class="doc-file-name">${esc(d.nome || 'arquivo')}</div>
                  <div class="rec-item-meta">${esc(fmtTamanho(d.tamanho))}${
                    d.tamanhoOriginal ? ' · reduzido de ' + esc(fmtTamanho(d.tamanhoOriginal)) : ''}</div>
                </div>
              </div>
              <div class="doc-file-acts">
                <button class="btn-icon" title="Baixar" onclick="baixarDocFuncionario('${it.key}',${i})">${ICO.baixar}</button>
                ${staffEditavel ? `<button class="btn-icon danger" title="Remover" onclick="staffRemoveDoc('${it.key}',${i})">${ICO.lixo}</button>` : ''}
              </div>
            </div>`).join('') + '</div>'
        : '<div class="rec-item-meta" style="margin-top:8px;">Nenhum arquivo.</div>';
      return `
        <div class="doc-card">
          <div class="doc-card-head">
            <span class="doc-card-title">${esc(it.label)}</span>
            <span class="doc-count ${arquivos.length ? 'ok' : ''}">${arquivos.length}/${MAX_POR_ITEM}</span>
          </div>
          ${linhas}
          ${staffEditavel && !cheio ? `
            <div class="uploader">
              <input type="file" multiple
                accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf"
                onchange="staffAddFiles('${it.key}', this)" />
              <div class="uploader-box">${ICO.anexo}Anexar arquivo</div>
            </div>` : ''}
        </div>`;
    }).join('') + '</div>';

    const rodape = staffEditavel ? `
      <div class="actions">
        <button class="btn ${staffSujo ? 'btn-primary' : 'btn-ghost'}" id="staffBtnSalvarDocs" onclick="staffSalvarDocs()">
          ${ICO.salvar}Salvar anexos
        </button>
        <span class="hint" style="margin:0;">${staffSujo
          ? 'Há anexos ainda não gravados nesta ficha.'
          : 'Anexos gravados.'}</span>
      </div>` : '';

    const vazio = total === 0 && !staffEditavel
      ? '<div class="empty-state">Nenhum documento anexado até agora, nem pelo portal nem pelas mesas.</div>'
      : '';

    box.innerHTML = vazio || (grade + rodape);
  }

  window.staffAddFiles = async function(itemKey, input) {
    const atual = staffDocs[itemKey] || [];
    const espaco = MAX_POR_ITEM - atual.length;
    let files = Array.from(input.files || []);
    if (files.length > espaco) {
      toast(`Máximo de ${MAX_POR_ITEM} arquivos por item. Anexei os ${espaco} primeiros.`);
      files = files.slice(0, espaco);
    }
    if (!files.length) { input.value = ''; return; }

    input.value = '';
    toast('Preparando...');

    for (const file of files) {
      try {
        const doc = await prepararArquivo(file);
        if (!staffDocs[itemKey]) staffDocs[itemKey] = [];
        staffDocs[itemKey].push(doc);
      } catch (e) {
        toast('Não consegui ler o arquivo ' + file.name);
      }
    }

    staffSujo = true;
    renderStaffDocs();
  };

  window.staffRemoveDoc = function(itemKey, i) {
    if (!staffEditavel) return;
    if (staffDocs[itemKey]) staffDocs[itemKey].splice(i, 1);
    staffSujo = true;
    renderStaffDocs();
  };

  window.staffSalvarDocs = async function() {
    if (!staffRecId) return;
    let total = 0;
    Object.values(staffDocs).forEach(arr => (arr || []).forEach(d => {
      total += Number(d.tamanho) || (d.base64 ? Math.floor(d.base64.length * 0.75) : 0);
    }));
    if (total > LIMITE_TOTAL_BYTES) {
      toast('Os anexos passam de ' + fmtMB(LIMITE_TOTAL_BYTES) + ' no total. Remova algum arquivo.');
      return;
    }
    const btn = document.getElementById('staffBtnSalvarDocs');
    if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
    const r = await chamarRPC('rpc_staff_salvar_documentos', { p_id: staffRecId, p_documentos: staffDocs });
    if (btn) { btn.disabled = false; }
    if (!r.ok) { renderStaffDocs(); return; }
    staffSujo = false;
    renderStaffDocs();
    toast('Anexos salvos.');
  };

  window.baixarDocFuncionario = function(itemKey, i) {
    const d = (staffDocs[itemKey] || [])[i];
    if (!d || !d.base64) { toast('Arquivo indisponível.'); return; }
    const a = document.createElement('a');
    a.href = d.base64;
    a.download = d.nome || ('documento-' + (i + 1));
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // ============================================================
  // HISTÓRICO (compartilhado)
  // ============================================================
  function historyCardHTML(rec) {
    const hist = rec.historico || [];
    if (hist.length === 0) return '';
    return `
      <div class="card">
        <div class="section-num"><div class="n">${ICO.historico}</div><h2>Histórico de encaminhamentos</h2></div>
        <div class="history-list">
          ${hist.slice().reverse().map(h => `
            <div class="history-item"><span class="hi-dot"></span><span>${esc(h.quando)} · <b>${esc(h.de)} para ${esc(h.para)}</b> · por ${esc(h.por)}</span></div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // ============================================================
  // INIT
  // ============================================================
  (async function init() {
    // Link do funcionário: ?portal=TOKEN → abre o portal, sem login.
    vigiarSessao();
    const tokenDaURL = new URLSearchParams(location.search).get('portal');
    if (tokenDaURL) {
      abrirPortal(tokenDaURL);
      return;
    }
    const { data: sessao } = await supabase.auth.getSession();
    if (sessao && sessao.session) {
      await carregarSessaoAtual();
    }
  })();
})();
</script>
</body>
</html>
